name: 유튜브 최신 영상 갱신

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 유튜브 최신 쇼츠 가져오기
        run: python3 .github/scripts/youtube_videos.py

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain -- videos.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json
          git commit -m '유튜브 최신 영상 목록 갱신'
          git push
